name: E2E (devnet, full suite incl. transactions)

# The complete suite — including the @tx lifecycle spec that submits real
# devnet transactions and waits out deadline windows. Runs on demand
# (workflow_dispatch) or when a pushed commit message contains `[full-e2e]`.
# The cheap read-only projects also run on every PR via ci.yml; `[skip-e2e]`
# bypasses those. No scheduled runs.
on:
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: e2e-devnet
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[full-e2e]')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write dev wallet keypairs
        env:
          MAKER_KEYPAIR: ${{ secrets.DEV_WALLET_MAKER_KEYPAIR }}
          TAKER1_KEYPAIR: ${{ secrets.DEV_WALLET_TAKER1_KEYPAIR }}
          TAKER2_KEYPAIR: ${{ secrets.DEV_WALLET_TAKER2_KEYPAIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/dev-wallets"
          printf '%s' "$MAKER_KEYPAIR" > "$RUNNER_TEMP/dev-wallets/maker.json"
          printf '%s' "$TAKER1_KEYPAIR" > "$RUNNER_TEMP/dev-wallets/taker1.json"
          printf '%s' "$TAKER2_KEYPAIR" > "$RUNNER_TEMP/dev-wallets/taker2.json"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full E2E suite (desktop + mobile + tx)
        run: npm run test:e2e
        env:
          DEV_WALLET_KEYPAIR_DIR: ${{ runner.temp }}/dev-wallets
          # Public devnet RPC throttles getProgramAccounts from datacenter
          # IPs — a dedicated endpoint is required for the runner (see #34).
          VITE_RPC_URL_DEVNET: ${{ secrets.DEVNET_RPC_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
