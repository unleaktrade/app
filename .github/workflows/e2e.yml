name: E2E (devnet, full lifecycle)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: e2e-devnet
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write dev wallet keypairs
        env:
          MAKER_KEYPAIR: ${{ secrets.DEV_WALLET_MAKER_KEYPAIR }}
          TAKER1_KEYPAIR: ${{ secrets.DEV_WALLET_TAKER1_KEYPAIR }}
          TAKER2_KEYPAIR: ${{ secrets.DEV_WALLET_TAKER2_KEYPAIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/dev-wallets"
          printf '%s' "$MAKER_KEYPAIR" > "$RUNNER_TEMP/dev-wallets/maker.json"
          printf '%s' "$TAKER1_KEYPAIR" > "$RUNNER_TEMP/dev-wallets/taker1.json"
          printf '%s' "$TAKER2_KEYPAIR" > "$RUNNER_TEMP/dev-wallets/taker2.json"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          DEV_WALLET_KEYPAIR_DIR: ${{ runner.temp }}/dev-wallets

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
