name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # SECURITY: never add `env: VITE_RPC_URL_*` (or any keyed URL) here.
        # Vite inlines VITE_* into the public client bundle, so a keyed RPC
        # endpoint would ship its API key to everyone. Production reads the
        # keyless public endpoint (env.ts falls back to clusterApiUrl); if a
        # dedicated RPC is ever needed for prod, front it with a same-origin
        # proxy that keeps the key server-side, never a VITE_* var.
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Add CNAME
        run: echo "app.unleak.trade" > build/CNAME

      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
