version: 2
updates:
  # npm: weekly, minor+patch grouped into one PR so the zero-ERESOLVE install
  # rule and the hermetic e2e gate review one diff instead of ten. Majors stay
  # individual PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # typescript-eslint hard-caps `typescript <6.1.0` and has no TS 7 support yet
    # (it runtime-throws on TS 7, and installing 7.x breaks the zero-ERESOLVE
    # rule). Skip the perpetually-unmergeable major until typescript-eslint
    # ships TS 7 support (tracked upstream). Minor/patch on 6.x still flow.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
